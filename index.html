<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">

<title>RN4020 BLE</title>

<style>

body{
    font-family:sans-serif;
    max-width:420px;
    margin:auto;
    padding:20px;
}

h1{
    text-align:center;
}

button{
    width:100%;
    height:55px;
    font-size:18px;
    margin-top:10px;
}

input{
    width:100%;
    height:55px;
    font-size:18px;
    margin-top:10px;
    box-sizing:border-box;
}

#status{
    margin-top:10px;
    font-weight:bold;
}

#log{
    margin-top:20px;
    border:1px solid #ccc;
    padding:10px;
    height:250px;
    overflow:auto;
    white-space:pre-wrap;
    font-size:13px;
}

</style>
</head>

<body>

<h1>RN4020 BLE接続</h1>

<button onclick="connectBLE()">
接続
</button>

<div id="status">
未接続
</div>

<input
id="sendText"
type="text"
placeholder="送信する文字を入力"
>

<button onclick="sendText()">
送信
</button>

<div id="log"></div>

<script>

let writeCharacteristic = null;

function log(msg){

    const area =
        document.getElementById("log");

    area.textContent += msg + "\n";

    area.scrollTop =
        area.scrollHeight;
}

async function connectBLE(){

    try{

        document.getElementById("status")
        .innerText =
        "RN4020選択中...";

        const device =
            await navigator.bluetooth.requestDevice({
                acceptAllDevices:true
            });

        log("デバイス: " + device.name);

        document.getElementById("status")
        .innerText =
        "接続中...";

        const server =
            await device.gatt.connect();

        log("GATT接続成功");

        const services =
            await server.getPrimaryServices();

        log("サービス数: " + services.length);

        for(const service of services){

            log("");
            log("Service");
            log(service.uuid);

            const chars =
                await service.getCharacteristics();

            for(const ch of chars){

                log(
                    "Characteristic: "
                    + ch.uuid
                );

                log(
                    "Read="
                    + ch.properties.read
                    + " Write="
                    + ch.properties.write
                    + " WriteNR="
                    + ch.properties.writeWithoutResponse
                    + " Notify="
                    + ch.properties.notify
                );

                if(
                    !writeCharacteristic &&
                    (
                        ch.properties.write ||
                        ch.properties.writeWithoutResponse
                    )
                ){

                    writeCharacteristic =
                        ch;

                    log(
                        "★送信用Characteristic発見"
                    );
                }

            }

        }

        if(writeCharacteristic){

            document.getElementById("status")
            .innerText =
            "接続成功";

        }else{

            document.getElementById("status")
            .innerText =
            "書込み先が見つかりません";

        }

    }catch(error){

        document.getElementById("status")
        .innerText =
        "エラー";

        log(error);

    }

}

async function sendText(){

    try{

        if(!writeCharacteristic){

            alert(
                "書込み可能Characteristicが見つかっていません"
            );

            return;
        }

        const text =
            document.getElementById("sendText")
            .value;

        const encoder =
            new TextEncoder();

        await writeCharacteristic.writeValue(
            encoder.encode(text)
        );

        log("送信: " + text);

    }catch(error){

        log("送信失敗");
        log(error);

    }

}

</script>

</body>
</html>
