<!DOCTYPE html>
<html>
<body>

<h1>RN4020 BLE接続</h1>

<button onclick="connectBLE()">接続</button>

<p id="status">未接続</p>

<script>

async function connectBLE() {

  try {

    document.getElementById("status").innerText =
      "デバイス選択中";

    const device =
      await navigator.bluetooth.requestDevice({
        acceptAllDevices: true
      });

    document.getElementById("status").innerText =
      "選択: " + device.name;

    const server =
      await device.gatt.connect();

    document.getElementById("status").innerText =
      "接続成功";

  } catch(err) {

    document.getElementById("status").innerText =
      "エラー: " + err;

  }

}

</script>

</body>
</html>
