<!DOCTYPE html>
<html lang="ja">

<head>
<meta charset="UTF-8">

<meta
    name="viewport"
    content="width=device-width, initial-scale=1, viewport-fit=cover"
>

<title>BLE 操作パネル</title>

<style>

/* 全体 */
*{
    box-sizing:border-box;
    -webkit-tap-highlight-color:transparent;
}

html,
body{
    margin:0;
    min-height:100%;
    background:#f4f6f8;
}

body{
    font-family:
        -apple-system,
        BlinkMacSystemFont,
        "Segoe UI",
        sans-serif;

    max-width:430px;
    margin:auto;
    padding:
        max(20px, env(safe-area-inset-top))
        20px
        max(20px, env(safe-area-inset-bottom));
}

h1{
    margin:10px 0 20px;
    text-align:center;
    font-size:28px;
}

button{
    font-family:inherit;
    touch-action:manipulation;
    cursor:pointer;
}

button:active{
    transform:scale(0.97);
}


/* 接続状態 */
#status{
    margin:12px 0 20px;
    padding:12px;
    border-radius:10px;
    text-align:center;
    font-weight:bold;
    color:#555;
    background:#e9ecef;
}

#status.connected{
    color:#126b2e;
    background:#dff5e5;
}

#status.error{
    color:#a50000;
    background:#ffe1e1;
}


/* 接続ボタン */
#connectBtn{
    width:100%;
    min-height:60px;
    border:none;
    border-radius:14px;
    color:white;
    background:#1677ff;
    font-size:20px;
    font-weight:bold;
}


/* モード選択画面 */
#modePage{
    display:block;
}

#modeButtons{
    display:none;
}

.mode-title{
    margin:25px 0 15px;
    text-align:center;
    font-size:21px;
}

.mode-button{
    width:100%;
    min-height:78px;
    margin-bottom:14px;
    border:none;
    border-radius:16px;
    color:white;
    font-size:23px;
    font-weight:bold;
}

.timer-button{
    background:#1677ff;
}

.change-button{
    background:#ff8a00;
}

.score-button{
    background:#7b48c8;
}


/* テンキー画面 */
#keypadPage{
    display:none;
}

#modeName{
    margin-bottom:5px;
    text-align:center;
    font-size:27px;
}

#display{
    width:100%;
    min-height:88px;
    margin:20px 0;
    padding:15px 18px;
    overflow:hidden;
    border:2px solid #cfd5dc;
    border-radius:15px;
    color:#111;
    background:white;
    text-align:right;
    font-size:44px;
    line-height:56px;
    white-space:nowrap;
}

.keypad{
    display:grid;
    grid-template-columns:repeat(3, 1fr);
    gap:11px;
}

.keypad button{
    min-height:78px;
    border:none;
    border-radius:14px;
    color:#111;
    background:white;
    box-shadow:0 2px 7px rgba(0,0,0,0.08);
    font-size:31px;
    font-weight:bold;
}

.keypad .delete-button{
    color:white;
    background:#e24b4b;
}

.keypad .buzzer-button{
    color:white;
    background:#f1a000;
    font-size:20px;
}

.confirm-button{
    grid-column:1 / span 3;
    color:white !important;
    background:#30a64a !important;
    font-size:25px !important;
}

.back-button{
    width:100%;
    min-height:55px;
    margin-top:18px;
    border:2px solid #777;
    border-radius:13px;
    color:#444;
    background:transparent;
    font-size:18px;
    font-weight:bold;
}


/* 送信メッセージ */
#message{
    min-height:25px;
    margin-top:15px;
    text-align:center;
    font-weight:bold;
}

.message-success{
    color:#168534;
}

.message-error{
    color:#c00000;
}


/* 画面が小さい場合 */
@media(max-height:700px){

    body{
        padding-top:10px;
    }

    h1{
        margin:5px 0 10px;
        font-size:24px;
    }

    #display{
        min-height:65px;
        margin:10px 0;
        padding:8px 15px;
        font-size:36px;
        line-height:45px;
    }

    .keypad{
        gap:8px;
    }

    .keypad button{
        min-height:60px;
        font-size:26px;
    }
}

</style>
</head>


<body>

<!-- 1ページ目：接続とモード選択 -->
<section id="modePage">

    <h1>BLE 操作パネル</h1>

    <button
        id="connectBtn"
        type="button"
        onclick="connectBLE()"
    >
        RN4020に接続
    </button>

    <div id="status">
        未接続
    </div>

    <div id="modeButtons">

        <div class="mode-title">
            使用するモードを選択
        </div>

        <button
            type="button"
            class="mode-button timer-button"
            onclick="selectMode('timer')"
        >
            タイマー
        </button>

        <button
            type="button"
            class="mode-button change-button"
            onclick="selectMode('change')"
        >
            選手交代
        </button>

        <button
            type="button"
            class="mode-button score-button"
            onclick="selectMode('score')"
        >
            得点板
        </button>

    </div>

</section>


<!-- 2ページ目：テンキー -->
<section id="keypadPage">

    <h1 id="modeName">
        操作画面
    </h1>

    <div id="display">
        0
    </div>

    <div class="keypad">

        <button type="button" onclick="pressKey('1')">1</button>
        <button type="button" onclick="pressKey('2')">2</button>
        <button type="button" onclick="pressKey('3')">3</button>

        <button type="button" onclick="pressKey('4')">4</button>
        <button type="button" onclick="pressKey('5')">5</button>
        <button type="button" onclick="pressKey('6')">6</button>

        <button type="button" onclick="pressKey('7')">7</button>
        <button type="button" onclick="pressKey('8')">8</button>
        <button type="button" onclick="pressKey('9')">9</button>

        <button
            type="button"
            class="delete-button"
            onclick="deleteKey()"
        >
            削除
        </button>

        <button type="button" onclick="pressKey('0')">0</button>

        <button
            type="button"
            class="buzzer-button"
            onclick="sendBuzzer()"
        >
            ブザー
        </button>

        <button
            type="button"
            class="confirm-button"
            onclick="confirmInput()"
        >
            確定
        </button>

    </div>

    <div id="message"></div>

    <button
        type="button"
        class="back-button"
        onclick="backToModePage()"
    >
        モード選択へ戻る
    </button>

</section>


<script>

/*
送信信号

タイマー   : a
選手交代   : b
得点板     : c
ブザー     : d

確定ボタン:
入力した数字をまとめて送信
*/

let bleDevice = null;
let gattServer = null;
let writeCharacteristic = null;

let inputValue = "";
let currentMode = "";


/* 状態表示 */
function setStatus(text, type = ""){

    const status =
        document.getElementById("status");

    status.textContent = text;
    status.className = type;
}


/* メッセージ表示 */
function showMessage(text, isError = false){

    const message =
        document.getElementById("message");

    message.textContent = text;

    message.className =
        isError
        ? "message-error"
        : "message-success";

    clearTimeout(showMessage.timer);

    showMessage.timer = setTimeout(() => {

        message.textContent = "";
        message.className = "";

    }, 2500);
}


/* 数字表示 */
function updateDisplay(){

    document.getElementById("display")
        .textContent = inputValue || "0";
}


/* RN4020へ接続 */
async function connectBLE(){

    try{

        if(!navigator.bluetooth){

            throw new Error(
                "Web Bluetooth非対応です。iPhoneではBluefyを使用してください。"
            );
        }

        setStatus(
            "RN4020を選択してください",
            ""
        );

        bleDevice =
            await navigator.bluetooth.requestDevice({
                acceptAllDevices:true
            });

        setStatus(
            "接続中...",
            ""
        );

        gattServer =
            await bleDevice.gatt.connect();

        bleDevice.addEventListener(
            "gattserverdisconnected",
            onDisconnected
        );

        writeCharacteristic = null;

        const services =
            await gattServer.getPrimaryServices();

        for(const service of services){

            const characteristics =
                await service.getCharacteristics();

            for(const characteristic of characteristics){

                if(
                    characteristic.properties.write ||
                    characteristic.properties.writeWithoutResponse
                ){

                    writeCharacteristic =
                        characteristic;

                    break;
                }
            }

            if(writeCharacteristic){
                break;
            }
        }

        if(!writeCharacteristic){

            throw new Error(
                "書き込み可能な送信先が見つかりません"
            );
        }

        setStatus(
            "接続成功：" +
            (bleDevice.name || "RN4020"),
            "connected"
        );

        document.getElementById("connectBtn")
            .style.display = "none";

        document.getElementById("modeButtons")
            .style.display = "block";

    }catch(error){

        console.error(error);

        setStatus(
            "接続失敗：" + error.message,
            "error"
        );
    }
}


/* 接続が切れたとき */
function onDisconnected(){

    writeCharacteristic = null;
    gattServer = null;

    inputValue = "";
    currentMode = "";

    updateDisplay();

    document.getElementById("keypadPage")
        .style.display = "none";

    document.getElementById("modePage")
        .style.display = "block";

    document.getElementById("modeButtons")
        .style.display = "none";

    document.getElementById("connectBtn")
        .style.display = "block";

    setStatus(
        "接続が切れました。もう一度接続してください。",
        "error"
    );
}


/* BLEデータ送信 */
async function sendBLE(text){

    if(
        !writeCharacteristic ||
        !bleDevice ||
        !bleDevice.gatt.connected
    ){

        throw new Error(
            "RN4020が接続されていません"
        );
    }

    const data =
        new TextEncoder().encode(text);

    if(
        writeCharacteristic.properties
            .writeWithoutResponse &&
        typeof writeCharacteristic
            .writeValueWithoutResponse === "function"
    ){

        await writeCharacteristic
            .writeValueWithoutResponse(data);

    }else if(
        typeof writeCharacteristic
            .writeValueWithResponse === "function"
    ){

        await writeCharacteristic
            .writeValueWithResponse(data);

    }else{

        await writeCharacteristic
            .writeValue(data);
    }
}


/* モード選択 */
async function selectMode(mode){

    let signal = "";
    let modeTitle = "";

    if(mode === "timer"){

        signal = "a";
        modeTitle = "タイマー";

    }else if(mode === "change"){

        signal = "b";
        modeTitle = "選手交代";

    }else if(mode === "score"){

        signal = "c";
        modeTitle = "得点板";

    }else{

        return;
    }

    try{

        await sendBLE(signal);

        currentMode = mode;
        inputValue = "";

        updateDisplay();

        document.getElementById("modeName")
            .textContent = modeTitle;

        document.getElementById("modePage")
            .style.display = "none";

        document.getElementById("keypadPage")
            .style.display = "block";

        showMessage(
            "モード信号「" +
            signal +
            "」を送信しました"
        );

    }catch(error){

        alert(
            "モード信号を送信できませんでした。\n" +
            error.message
        );
    }
}


/* 数字を入力 */
function pressKey(key){

    if(inputValue.length >= 8){

        showMessage(
            "入力できるのは8桁までです",
            true
        );

        return;
    }

    inputValue += key;

    updateDisplay();
}


/* 1文字削除 */
function deleteKey(){

    inputValue =
        inputValue.slice(0, -1);

    updateDisplay();
}


/* 入力した数字を送信 */
async function confirmInput(){

    if(inputValue.length === 0){

        showMessage(
            "数字を入力してください",
            true
        );

        return;
    }

    try{

        const sentValue = inputValue;

        await sendBLE(sentValue);

        showMessage(
            "「" +
            sentValue +
            "」を送信しました"
        );

        inputValue = "";

        updateDisplay();

    }catch(error){

        showMessage(
            "送信失敗：" + error.message,
            true
        );
    }
}


/* ブザー信号dを送信 */
async function sendBuzzer(){

    try{

        await sendBLE("d");

        showMessage(
            "ブザー信号「d」を送信しました"
        );

    }catch(error){

        showMessage(
            "ブザー信号の送信失敗：" +
            error.message,
            true
        );
    }
}


/* モード選択画面へ戻る */
function backToModePage(){

    inputValue = "";
    currentMode = "";

    updateDisplay();

    document.getElementById("keypadPage")
        .style.display = "none";

    document.getElementById("modePage")
        .style.display = "block";
}

</script>

</body>
</html>
