<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">

<title>RN4020 BLE</title>

<style>
body{
    font-family: sans-serif;
    max-width: 400px;
    margin: auto;
    padding: 20px;
    text-align: center;
}

h1{
    font-size: 28px;
}

button{
    width: 100%;
    height: 50px;
    font-size: 18px;
    margin-top: 10px;
}

input{
    width: 100%;
    height: 50px;
    font-size: 18px;
    margin-top: 10px;
    box-sizing: border-box;
}

#status{
    margin-top: 10px;
    color: green;
}
</style>

</head>
<body>

<h1>RN4020 BLE接続</h1>

<button onclick="connectBLE()">接続</button>

<p id="status">未接続</p>

<input id="sendText" placeholder="送信する文字">

<button onclick="sendText()">
送信
</button>

<script>

let writeCharacteristic;

async function connectBLE(){

    try{

        const device =
        await navigator.bluetooth.requestDevice({
            acceptAllDevices: true,
            optionalServices: [
                "サービスUUID"
            ]
        });

        const server =
        await device.gatt.connect();

        const service =
        await server.getPrimaryService(
            "サービスUUID"
        );

        writeCharacteristic =
        await service.getCharacteristic(
            "キャラクタリスティックUUID"
        );

        document.getElementById("status").innerText =
            "接続成功";

    }catch(e){

        document.getElementById("status").innerText =
            e;

    }
}

async function sendText(){

    if(!writeCharacteristic){
        alert("先に接続してください");
        return;
    }

    const text =
        document.getElementById("sendText").value;

    await writeCharacteristic.writeValue(
        new TextEncoder().encode(text)
    );

    alert("送信しました");
}

</script>

</body>
</html>
