<script>

/*
送信信号

タイマー   : a
選手交代   : b
得点板     : c
ブザー     : d


確定ボタン:
入力した数字をまとめて送信
*/

let bleDevice = null;
let gattServer = null;
let writeCharacteristic = null;

let inputValue = "";
let currentMode = "";


/* 状態表示 */
function setStatus(text, type = ""){

    const status =
        document.getElementById("status");

    status.textContent = text;
    status.className = type;
}


/* メッセージ表示 */
function showMessage(text, isError = false){

    const message =
        document.getElementById("message");

    message.textContent = text;

    message.className =
        isError
        ? "message-error"
        : "message-success";

    clearTimeout(showMessage.timer);

    showMessage.timer = setTimeout(() => {

        message.textContent = "";
        message.className = "";

    }, 2500);
}


/* 数字表示 */
function updateDisplay(){

    document.getElementById("display")
        .textContent = inputValue || "0";
}


/* RN4020へ接続 */
async function connectBLE(){

    try{

        if(!navigator.bluetooth){

            throw new Error(
                "Web Bluetooth非対応です。iPhoneではBluefyを使用してください。"
            );
        }

        setStatus(
            "RN4020を選択してください",
            ""
        );

        bleDevice =
            await navigator.bluetooth.requestDevice({
                acceptAllDevices:true
            });

        setStatus(
            "接続中...",
            ""
        );

        gattServer =
            await bleDevice.gatt.connect();

        bleDevice.addEventListener(
            "gattserverdisconnected",
            onDisconnected
        );

        writeCharacteristic = null;

        const services =
            await gattServer.getPrimaryServices();

        for(const service of services){

            const characteristics =
                await service.getCharacteristics();

            for(const characteristic of characteristics){

                if(
                    characteristic.properties.write ||
                    characteristic.properties.writeWithoutResponse
                ){

                    writeCharacteristic =
                        characteristic;

                    break;
                }
            }

            if(writeCharacteristic){
                break;
            }
        }

        if(!writeCharacteristic){

            throw new Error(
                "書き込み可能な送信先が見つかりません"
            );
        }

        setStatus(
            "接続成功：" +
            (bleDevice.name || "RN4020"),
            "connected"
        );

        document.getElementById("connectBtn")
            .style.display = "none";

        document.getElementById("modeButtons")
            .style.display = "block";

    }catch(error){

        console.error(error);

        setStatus(
            "接続失敗：" + error.message,
            "error"
        );
    }
}


/* 接続が切れたとき */
function onDisconnected(){

    writeCharacteristic = null;
    gattServer = null;

    inputValue = "";
    currentMode = "";

    updateDisplay();

    document.getElementById("keypadPage")
        .style.display = "none";

    document.getElementById("modePage")
        .style.display = "block";

    document.getElementById("modeButtons")
        .style.display = "none";

    document.getElementById("connectBtn")
        .style.display = "block";

    setStatus(
        "接続が切れました。もう一度接続してください。",
        "error"
    );
}


/* BLEデータ送信 */
async function sendBLE(text){

    if(
        !writeCharacteristic ||
        !bleDevice ||
        !bleDevice.gatt.connected
    ){

        throw new Error(
            "RN4020が接続されていません"
        );
    }

    const data =
        new TextEncoder().encode(text);

    if(
        writeCharacteristic.properties
            .writeWithoutResponse &&
        typeof writeCharacteristic
            .writeValueWithoutResponse === "function"
    ){

        await writeCharacteristic
            .writeValueWithoutResponse(data);

    }else if(
        typeof writeCharacteristic
            .writeValueWithResponse === "function"
    ){

        await writeCharacteristic
            .writeValueWithResponse(data);

    }else{

        await writeCharacteristic
            .writeValue(data);
    }
}


/* モード選択 */
async function selectMode(mode){

    let signal = "";
    let modeTitle = "";

    if(mode === "timer"){

        signal = "a";
        modeTitle = "タイマー";

    }else if(mode === "change"){

        signal = "b";
        modeTitle = "選手交代";

    }else if(mode === "score"){

        signal = "c";
        modeTitle = "得点板";

    }else{

        return;
    }

    try{

        await sendBLE(signal);

        currentMode = mode;
        inputValue = "";

        updateDisplay();

        document.getElementById("modeName")
            .textContent = modeTitle;

        document.getElementById("modePage")
            .style.display = "none";

        document.getElementById("keypadPage")
            .style.display = "block";

        showMessage(
            "モード信号「" +
            signal +
            "」を送信しました"
        );

    }catch(error){

        alert(
            "モード信号を送信できませんでした。\n" +
            error.message
        );
    }
}


/* 数字を入力 */
function pressKey(key){

    if(inputValue.length >= 8){

        showMessage(
            "入力できるのは8桁までです",
            true
        );

        return;
    }

    inputValue += key;

    updateDisplay();
}


/* 1文字削除 */
function deleteKey(){

    inputValue =
        inputValue.slice(0, -1);

    updateDisplay();
}


/* 入力した数字を送信 */
async function confirmInput(){

    if(inputValue.length === 0){

        showMessage(
            "数字を入力してください",
            true
        );

        return;
    }

    try{

        const sentValue = inputValue;

        await sendBLE(sentValue);

        showMessage(
            "「" +
            sentValue +
            "」を送信しました"
        );

        inputValue = "";

        updateDisplay();

    }catch(error){

        showMessage(
            "送信失敗：" + error.message,
            true
        );
    }
}


/* ブザー信号dを送信 */
async function sendBuzzer(){

    try{

        await sendBLE("d");

        showMessage(
            "ブザー信号「d」を送信しました"
        );

    }catch(error){

        showMessage(
            "ブザー信号の送信失敗：" +
            error.message,
            true
        );
    }
}

    inputValue = "";

}

/* テンキーを開く */
function openKeypad(mode, modeTitle){

    currentMode = mode;
    inputValue = "";

    updateDisplay();

    document.getElementById("modeName")
        .textContent = modeTitle;

    document.getElementById("modePage")
        .style.display = "none";

/* ストップウォッチが動作中か */
let stopwatchRunning = false;


/* スタート・ストップを切り替える */
async function toggleStopwatch(){

    try{

        await sendBLE("S");

        stopwatchRunning = !stopwatchRunning;

        const button =
            document.getElementById("startStopBtn");

        if(stopwatchRunning){

            button.textContent = "ストップ";
            button.classList.add("stopping");

        }else{

            button.textContent = "スタート";
            button.classList.remove("stopping");
        }

    }catch(error){

        alert(
            "スタート・ストップ信号を送信できませんでした。\n" +
            error.message
        );
    }
}


/* ストップウォッチをリセット */
async function resetStopwatch(){

    try{

        await sendBLE("R");

        stopwatchRunning = false;

        const button =
            document.getElementById("startStopBtn");

        button.textContent = "スタート";
        button.classList.remove("stopping");

    }catch(error){

        alert(
            "リセット信号を送信できませんでした。\n" +
            error.message
        );
    }
}
</script>

</body>
</html>

/* テンキーからメインメニューへ戻る */
function backToMainMenu(){

    inputValue = "";
    currentMode = "";

    updateDisplay();

    document.getElementById("keypadPage")
        .style.display = "none";

    const sportsPage =
        document.getElementById("sportsPage");

    const clockPage =
        document.getElementById("clockPage");

    if(sportsPage){
        sportsPage.style.display = "none";
    }

    if(clockPage){
        clockPage.style.display = "none";
    }

    document.getElementById("modePage")
        .style.display = "block";
}
		/* 時計関係のモードを選択 */
async function selectClockMode(mode){

    try{

        if(mode === "stopwatch"){

            await sendBLE("B");

            document.getElementById("clockPage")
                .style.display = "none";

            document.getElementById("stopwatchPage")
                .style.display = "block";

        }else if(mode === "timer"){

            await sendBLE("C");

            timerInputValue = "";
            updateTimerDisplay();

            document.getElementById("clockPage")
                .style.display = "none";

            document.getElementById("timerPage")
                .style.display = "block";
        }

    }catch(error){

        alert(
            "モード信号を送信できませんでした。\n" +
            error.message
        );
    }
}
</script>

</body>
</html>
