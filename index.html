<!DOCTYPE html>
<html lang="ja">

<head>
<meta charset="UTF-8">
<meta name="viewport"
content="width=device-width,initial-scale=1">

<title>RN4020 Timer</title>

<style>

body{
    font-family:sans-serif;
    max-width:420px;
    margin:auto;
    padding:20px;
}

h1{
    text-align:center;
}

button{
    border:none;
    border-radius:10px;
}

#connectBtn{
    width:100%;
    height:55px;
    font-size:18px;
}

#status{
    margin-top:10px;
    text-align:center;
    font-weight:bold;
}

#display{
    height:70px;
    line-height:70px;
    margin-top:20px;
    border:2px solid #ccc;
    border-radius:10px;
    text-align:right;
    font-size:40px;
    padding-right:15px;
    background:#fff;
}

.keypad{
    display:grid;
    grid-template-columns:repeat(3,1fr);
    gap:10px;
    margin-top:20px;
}

.keypad button{
    height:80px;
    font-size:30px;
    background:#f0f0f0;
}

#log{
    margin-top:20px;
    border:1px solid #ccc;
    border-radius:10px;
    padding:10px;
    height:180px;
    overflow:auto;
    white-space:pre-wrap;
    font-size:12px;
}

</style>
</head>

<body>

<h1>RN4020 タイマー</h1>

<button id="connectBtn"
onclick="connectBLE()">
接続
</button>

<div id="status">
未接続
</div>

<div id="display">
0
</div>

<div class="keypad">

<button onclick="pressKey('1')">1</button>
<button onclick="pressKey('2')">2</button>
<button onclick="pressKey('3')">3</button>

<button onclick="pressKey('4')">4</button>
<button onclick="pressKey('5')">5</button>
<button onclick="pressKey('6')">6</button>

<button onclick="pressKey('7')">7</button>
<button onclick="pressKey('8')">8</button>
<button onclick="pressKey('9')">9</button>

<button onclick="deleteKey()">←</button>
<button onclick="pressKey('0')">0</button>
<button onclick="buzzer()">🔔</button>

</div>

<div id="log"></div>

<script>

let writeCharacteristic=null;
let inputValue="";

function log(text){

    const area=
    document.getElementById("log");

    area.textContent+=text+"\n";

    area.scrollTop=
    area.scrollHeight;
}

function updateDisplay(){

    document.getElementById("display")
    .innerText=inputValue || "0";
}

async function connectBLE(){

    try{

        document.getElementById("status")
        .innerText="RN4020選択中";

        const device=
        await navigator.bluetooth.requestDevice({
            acceptAllDevices:true
        });

        log("デバイス: "+device.name);

        const server=
        await device.gatt.connect();

        log("接続成功");

        const services=
        await server.getPrimaryServices();

        for(const service of services){

            const chars=
            await service.getCharacteristics();

            for(const ch of chars){

                if(
                    !writeCharacteristic &&
                    (
                        ch.properties.write ||
                        ch.properties.writeWithoutResponse
                    )
                ){

                    writeCharacteristic=ch;

                    log("送信先発見");
                }
            }
        }

        if(writeCharacteristic){

            document.getElementById("status")
            .innerText="接続成功";

        }else{

            document.getElementById("status")
            .innerText=
            "送信先が見つかりません";
        }

    }catch(e){

        document.getElementById("status")
        .innerText="接続失敗";

        log(e);
    }
}

async function sendBLE(text){

    if(!writeCharacteristic){

        alert("先に接続してください");

        return;
    }

    await writeCharacteristic.writeValue(
        new TextEncoder().encode(text)
    );

    log("送信: "+text);
}

async function pressKey(key){

    inputValue+=key;

    updateDisplay();

    await sendBLE(key);
}

function deleteKey(){

    inputValue=
    inputValue.slice(0,-1);

    updateDisplay();
}

async function buzzer(){

    await sendBLE("B");
}

</script>

</body>

</html>
